openapi: 3.1.0
info:
  title: TirpScanner Global SaaS/AI-Tool Deal Scanner & Affiliate API
  version: 1.0.0
  summary: Standalone REST API for TirpScanner (tirpscanr.com, registered; wiring pending) — SaaS/AI-tool deals & affiliate
  description: |
   Complete OpenAPI 3.1 contract covering all 22 API groups mandated by Article 19:
    1. Authentication API, 2. Users API, 3. Organizations API, 4. Providers API,
    5. Cloud Catalog API, 6. Pricing API, 7. Comparison API, 8. Search API,
    9. Promotions API, 10. Affiliate API, 11. Tracking API, 12. Cloud Connection API,
    13. Server Provisioning API, 14. Server Management API, 15. Budget API,
    16. Cloud Cost API, 17. Price Alert API, 18. Analytics API, 19. Admin API,
    20. Content API, 21. Audit API, 22. Notifications API.

    Implementation status (commercialization cut, see COMMERCIALIZATION.md):
    IMPLEMENTED — auth register/login/me; providers + catalog categories/skus;
    search/skus + rankings/best-value; affiliate/disclosure + /go redirect +
    webhooks/affiliate postbacks; cloud connections/approvals/budgets/resources;
    cloud servers CRUD with approval+budget gates (sync 201/200, provider-side
    execution pending live management adapters); pricing/estimate (canonical)
    with estimate/tco alias; pricing/fx-rates (503 without PostgreSQL); admin
    overview/users/providers/audit-logs/notices/settings; public notices and
    site-config; Idempotency-Key enforcement on cloud/admin mutations.
    PLANNED (Phase 4) — email verify, MFA/TOTP enrolment, logout/refresh,
    users/orgs self-service, comparisons, promotions, costs/summary,
    price-alerts, analytics, content, standalone audit-logs API, notifications,
    server power/resize actions, pricing quarantine, affiliate CSV reconcile
    endpoint. Tokens are v1 HMAC-SHA256 (not PASETO); the HTTP router is
    net/http ServeMux.
    PIVOT 2026-11-26 — TirpScanner: the /api/v1/cloud/* surface (groups 12–16:
    connections, provisioning, server management, budgets, costs) is RETIRED and
    every operation below carries deprecated:true. Live surface is
    affiliate/catalog/deal/search/content/admin. Apex tirpscanr.com is
    REGISTERED (wiring pending); api.tirpscanr.com, www.tirpscanr.com are ASSUMED.
  contact:
    name: TirpScanner Lead System Architecture Team
    url: https://tirpscanr.com
servers:
  - url: https://api.tirpscanr.com
    description: Production Edge API
  - url: https://staging-api.tirpscanr.com
    description: Staging Verification API
  - url: http://localhost:8080
    description: Local Developer & Agent Simulator
tags:
  - name: 01_Authentication
    description: Registration, Email Verification, Login, MFA/TOTP, Passkeys, Token Refresh
  - name: 02_Users
    description: User Profile, Preferences, Sessions, Data Export & Account Deletion
  - name: 03_Organizations
    description: Multi-Tenant Organizations, Team Invitations & RBAC Permissions
  - name: 04_Providers
    description: SaaS Vendors & AI Tools Directory, Plans & Regions
  - name: 05_Cloud_Catalog
    description: SaaS/AI-Tool Catalog, Subscription Plans & Deal Snapshots
  - name: 06_Pricing
    description: Plan-Price Normalization, Deal Estimates, FX Rates, Tax Policies & Historical Snapshots
  - name: 07_Comparison
    description: Side-by-Side Multi-SKU Comparison Lists & Shareable Matrices
  - name: 08_Search
    description: Sub-50ms OpenSearch Deal Facets, Natural Language Query Parser & Rankings
  - name: 09_Promotions
    description: SaaS Deals, Free Trials, Discount Coupons & Validity Terms
  - name: 10_Affiliate
    description: Public Affiliate Programs, Campaigns & Compliant Link Metadata
  - name: 11_Tracking
    description: /go/{slug} Outbound Redirect & Signed Network Conversion Postbacks
  - name: 12_Cloud_Connection
    description: "RETIRED 2026-11-26 — BYOC connection surface removed"
  - name: 13_Server_Provisioning
    description: "RETIRED 2026-11-26 — BYOC provisioning surface removed"
  - name: 14_Server_Management
    description: "RETIRED 2026-11-26 — BYOC server management surface removed"
  - name: 15_Budget
    description: "RETIRED 2026-11-26 — BYOC budget surface removed"
  - name: 16_Cloud_Cost
    description: "RETIRED 2026-11-26 — BYOC cost surface removed"
  - name: 17_Price_Alert
    description: Automated Plan & Deal Price-Drop Subscriptions
  - name: 18_Analytics
    description: Affiliate Yield (EPC/CVR), Search Demand Trends & Funnel Metrics
  - name: 19_Admin
    description: Provider Sync Quarantine, Affiliate Ledger Reconciliation & Security Freeze
  - name: 20_Content
    description: Tutorials, Deal Guides, Verified Vendor Reviews & Methodology
  - name: 21_Audit
    description: Tamper-Evident Hash-Chained Security & Admin Operation Audit Logs
  - name: 22_Notifications
    description: User In-App Notifications, Email Alerts & SSRF-Safe Webhook Dispatch

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TirpScanner-HMAC-SHA256-v1
      description: Short-lived (15m) HMAC-SHA256 access token (identity/token.go) with user_id, org_id, role, and expiry claims.
    StepUpMFAAuth:
      type: apiKey
      in: header
      name: X-Step-Up-MFA-Token
      description: Required for sensitive admin approvals and destructive admin actions. (BYOC provisioning use retired 2026-11-26.)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: "Unique client key preventing duplicate execution and double billing. Replays return the stored outcome; backed by a process-local in-memory store (single-instance only until a shared Redis backend lands)."
    OrgIdHeader:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional tenant context; when present it must match the session org or the request is rejected with 403.
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    SKUItem:
      type: object
      required: [id, provider_slug, external_sku_code, category, specs, pricing, freshness_status]
      properties:
        id: { type: string, format: uuid }
        provider_slug: { type: string }
        external_sku_code: { type: string }
        display_name: { type: string }
        category: { type: string }
        region_code: { type: string }
        country_code: { type: string }
        freshness_status: { type: string, enum: [FRESH, STALE, QUARANTINED, UNVERIFIED] }
        value_score: { type: number }
        specs:
          type: object
          properties:
            tier_code: { type: string, enum: [FREE, PLUS, PRO, TEAM, ENTERPRISE] }
            billing_cycle: { type: string, enum: [MONTHLY, ANNUAL, BIENNIAL, LIFETIME, USAGE_BASED] }
            seat_model: { type: string, enum: [FLAT, PER_SEAT, TIERED_SEATS, USAGE] }
            included_seats: { type: integer }
            trial_days: { type: integer }
            trial_requires_card: { type: boolean }
            usage_unit: { type: string }
            usage_included_qty: { type: string }
        pricing:
          type: object
          properties:
            native_currency: { type: string }
            raw_monthly_price: { type: string }
            raw_annual_price: { type: string }
            monthly_equivalent: { type: string }
            annual_discount_pct: { type: string }
            per_seat_price: { type: string }
            tax_included: { type: boolean }
            collected_at: { type: string, format: date-time }
            official_source_url: { type: string, format: uri }
    TCOEstimateRequest:
      type: object
      required: [plan_ids, billing_cycle, seat_count, target_currency]
      properties:
        plan_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 20
        billing_cycle: { type: string, enum: [MONTHLY, ANNUAL], default: MONTHLY }
        seat_count: { type: integer, minimum: 1, default: 1 }
        coupon_code: { type: string }
        trial_days_remaining: { type: integer, minimum: 0, default: 0 }
        target_currency: { type: string, default: USD }
        country_code_for_tax: { type: string, default: KR }
        include_tax: { type: boolean, default: false }
    CostApprovalRequest:
      deprecated: true
      description: "RETIRED 2026-11-26 — BYOC approval schema."
      type: object
      required: [connection_id, operation_type, sku_id, region_code, acknowledged_monthly_cost_usd]
      properties:
        connection_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [CREATE_SERVER, RESIZE_SERVER, ENABLE_BACKUP, DELETE_SERVER, REBUILD_SERVER] }
        sku_id: { type: string, format: uuid }
        target_resource_id: { type: ["string", "null"], format: uuid }
        region_code: { type: string }
        acknowledged_hourly_cost_usd: { type: string }
        acknowledged_monthly_cost_usd: { type: string }
        destructive_confirmation_hostname: { type: ["string", "null"] }
    CreateServerRequest:
      deprecated: true
      description: "RETIRED 2026-11-26 — BYOC provisioning schema."
      type: object
      required: [connection_id, approval_id, sku_id, region_code, image_slug, hostname]
      properties:
        connection_id: { type: string, format: uuid }
        approval_id: { type: string, format: uuid }
        sku_id: { type: string, format: uuid }
        region_code: { type: string }
        image_slug: { type: string }
        hostname: { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9.-]{1,61}[a-zA-Z0-9]$" }
        ssh_key_ids:
          type: array
          items: { type: string }
        enable_backups: { type: boolean, default: false }
        enable_ipv6: { type: boolean, default: true }
        user_data_cloud_init: { type: ["string", "null"] }

paths:
  # 1. Authentication API
  /api/v1/auth/register:
    post:
      tags: [01_Authentication]
      summary: Register a new standalone TirpScanner user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                display_name: { type: string }
      responses:
        "201": { description: Account created and verification email queued }
        "409": { description: Email already registered }
  /api/v1/auth/verify-email:
    post:
      tags: [01_Authentication]
      summary: Verify user email ownership token
      operationId: verifyEmail
      responses:
        "200": { description: Email verified }
  /api/v1/auth/login:
    post:
      tags: [01_Authentication]
      summary: Authenticate with email and Argon2id password
      operationId: loginUser
      responses:
        "200": { description: Authenticated or MFA challenge required }
  /api/v1/auth/mfa/verify:
    post:
      tags: [01_Authentication]
      summary: Verify TOTP or WebAuthn Passkey for login or step-up authorization
      operationId: verifyMFA
      responses:
        "200": { description: Step-up MFA token issued }
  /api/v1/auth/logout:
    post:
      tags: [01_Authentication]
      security: [{ BearerAuth: [] }]
      summary: Revoke active session and refresh token family
      operationId: logoutUser
      responses:
        "204": { description: Session revoked }

  /api/v1/auth/me:
    get:
      tags: [01_Authentication]
      security: [{ BearerAuth: [] }]
      summary: Return the authenticated session user profile
      operationId: getAuthMe
      responses:
        "200": { description: User profile returned }

  # 2. Users API
  /api/v1/users/me:
    get:
      tags: [02_Users]
      security: [{ BearerAuth: [] }]
      summary: Retrieve current user profile, preferences, and organization memberships
      operationId: getCurrentUser
      responses:
        "200": { description: User profile returned }
    patch:
      tags: [02_Users]
      security: [{ BearerAuth: [] }]
      summary: Update locale, currency, and profile settings
      operationId: updateCurrentUser
      responses:
        "200": { description: Profile updated }
    delete:
      tags: [02_Users]
      security: [{ BearerAuth: [], StepUpMFAAuth: [] }]
      summary: Initiate account deletion and purge personal data
      operationId: deleteCurrentUser
      responses:
        "202": { description: Account scheduled for deletion and data purge }
  /api/v1/users/me/export:
    post:
      tags: [02_Users]
      security: [{ BearerAuth: [] }]
      summary: Export all personal user data (GDPR/PIPA compliance)
      operationId: exportUserData
      responses:
        "200": { description: JSON archive returned }

  # 3. Organizations API
  /api/v1/orgs:
    get:
      tags: [03_Organizations]
      security: [{ BearerAuth: [] }]
      summary: List organizations the user belongs to
      operationId: listOrganizations
      responses:
        "200": { description: Organizations list }
    post:
      tags: [03_Organizations]
      security: [{ BearerAuth: [] }]
      summary: Create a new tenant organization
      operationId: createOrganization
      responses:
        "201": { description: Organization created }
  /api/v1/orgs/{org_id}/members:
    get:
      tags: [03_Organizations]
      security: [{ BearerAuth: [] }]
      summary: List organization members and RBAC permissions
      operationId: listOrgMembers
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Member list }
    post:
      tags: [03_Organizations]
      security: [{ BearerAuth: [] }]
      summary: Invite a member and assign RBAC role (Owner/Admin/Operator/Viewer)
      operationId: inviteOrgMember
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Member invited }

  # 4. Providers API
  /api/v1/providers:
    get:
      tags: [04_Providers]
      summary: List all SaaS vendors and AI tools with verification statuses
      operationId: listProviders
      responses:
        "200": { description: Providers list }
  /api/v1/providers/{slug}:
    get:
      tags: [04_Providers]
      summary: Get detailed vendor profile, tools, plans, deals, and reviews
      operationId: getProviderBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provider detail }

  # 5. Cloud Catalog API
  /api/v1/catalog/categories:
    get:
      tags: [05_Cloud_Catalog]
      summary: List all SaaS/AI-tool categories and plan counts
      operationId: listCatalogCategories
      responses:
        "200": { description: Category taxonomy }
  /api/v1/catalog/skus:
    get:
      tags: [05_Cloud_Catalog]
      summary: List normalized SaaS plans with specs and latest price snapshots
      operationId: listCatalogSKUs
      responses:
        "200": { description: Paginated SKU list }
  /api/v1/catalog/skus/{sku_id}:
    get:
      tags: [05_Cloud_Catalog]
      summary: Get full normalized plan specification, historical price chart, and official source link
      operationId: getSKUDetail
      parameters:
        - name: sku_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: SKU detail }

  # 6. Pricing API
  /api/v1/pricing/estimate:
    post:
      tags: [06_Pricing]
      summary: Calculate itemized subscription estimate (implemented; canonical path, identical to /api/v1/estimate/tco alias)
      operationId: calculateTCOEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TCOEstimateRequest"
      responses:
        "200": { description: Itemized raw vs estimated TCO breakdown }
  /api/v1/estimate/tco:
    post:
      tags: [06_Pricing]
      summary: Alias of POST /api/v1/pricing/estimate (implemented; kept for backward compatibility; TCO naming is legacy)
      operationId: calculateTCOEstimateAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TCOEstimateRequest"
      responses:
        "200": { description: Itemized raw vs estimated TCO breakdown }
  /api/v1/pricing/fx-rates:
    get:
      tags: [06_Pricing]
      summary: Get latest FX rates from PostgreSQL seed data (implemented; 503 without a database)
      operationId: getFXRates
      responses:
        "200": { description: FX rate table }

  # 7. Comparison API
  /api/v1/comparisons:
    post:
      tags: [07_Comparison]
      summary: Create or save a side-by-side multi-plan comparison matrix
      operationId: createComparisonList
      responses:
        "201": { description: Comparison matrix created with share_slug }
  /api/v1/comparisons/{share_slug}:
    get:
      tags: [07_Comparison]
      summary: Retrieve a saved comparison matrix with live normalized plan prices
      operationId: getComparisonBySlug
      parameters:
        - name: share_slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Side-by-side comparison payload }

  # 8. Search API
  /api/v1/search/skus:
    get:
      tags: [08_Search]
      summary: Execute faceted OpenSearch deal query + natural language parsing
      operationId: searchSKUs
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: "Natural language deal query (e.g. 'ai video editor under $20 with annual discount')"
        - name: category
          in: query
          schema: { type: string }
        - name: billing_cycle
          in: query
          schema: { type: string }
        - name: max_per_seat_usd
          in: query
          schema: { type: number }
        - name: trial_required
          in: query
          schema: { type: boolean }
        - name: max_monthly_usd
          in: query
          schema: { type: number }
      responses:
        "200": { description: Matching SKUs, parsed filter chips, and facet buckets }
  /api/v1/rankings/best-value:
    get:
      tags: [08_Search]
      summary: Get unbiased Best-Value leaderboard per use-case preset
      operationId: getBestValueRankings
      responses:
        "200": { description: Ranked SKUs with transparent score components }

  # 9. Promotions API
  /api/v1/promotions:
    get:
      tags: [09_Promotions]
      summary: List verified SaaS deals, free trials, and promotional coupons
      operationId: listPromotions
      responses:
        "200": { description: Active promotions list }

  # 10. Affiliate API
  /api/v1/affiliate/disclosure:
    get:
      tags: [10_Affiliate]
      summary: Retrieve transparent affiliate program relationships and editorial policy
      operationId: getAffiliateDisclosure
      responses:
        "200": { description: Disclosure metadata }

  # 11. Tracking API
  /go/{slug}:
    get:
      tags: [11_Tracking]
      summary: High-speed affiliate redirect router with signed ClickID/SubID injection
      operationId: redirectAffiliateLink
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirect to verified affiliate network tracking URL }
  /api/v1/webhooks/affiliate/{network}:
    post:
      tags: [11_Tracking]
      summary: Ingest HMAC-verified conversion postbacks from Impact, CJ, PartnerStack, or HasOffers
      operationId: ingestAffiliatePostback
      parameters:
        - name: network
          in: path
          required: true
          schema: { type: string, enum: [impact, cj, partnerstack, hasoffers] }
      responses:
        "200": { description: Conversion reconciled idempotently }

  # 12. Cloud Connection API — RETIRED 2026-11-26 (BYOC removed)
  /api/v1/cloud/connections:
    get:
      tags: [12_Cloud_Connection]
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgIdHeader" }]
      summary: "[RETIRED 2026-11-26] List connected BYOC cloud accounts"
      operationId: listCloudConnections
      deprecated: true
      responses:
        "200": { description: Tenant-isolated connections list }
    post:
      tags: [12_Cloud_Connection]
      security: [{ BearerAuth: [], StepUpMFAAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      summary: "[RETIRED 2026-11-26] Connect a user-owned cloud account"
      operationId: createCloudConnection
      deprecated: true
      responses:
        "201": { description: Connection verified and encrypted with KMS DEK+AAD }
  /api/v1/cloud/connections/{connection_id}:
    get:
      tags: [12_Cloud_Connection]
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - name: connection_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: "[RETIRED 2026-11-26] Get a BYOC connection"
      operationId: getCloudConnection
      deprecated: true
      responses:
        "200": { description: Tenant-isolated connection detail }
    delete:
      tags: [12_Cloud_Connection]
      security: [{ BearerAuth: [], StepUpMFAAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - name: connection_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: "[RETIRED 2026-11-26] Disconnect BYOC account"
      operationId: disconnectCloudAccount
      deprecated: true
      responses:
        "204": { description: Account disconnected and credentials wiped }

  /api/v1/cloud/resources:
    get:
      tags: [12_Cloud_Connection]
      security: [{ BearerAuth: [] }]
      summary: "[RETIRED 2026-11-26] List tenant cloud resource inventory"
      operationId: listCloudResources
      deprecated: true
      responses:
        "200": { description: Tenant-isolated resources list }

  # 13. Server Provisioning API — RETIRED 2026-11-26 (BYOC removed)
  /api/v1/cloud/approvals:
    post:
      tags: [13_Server_Provisioning]
      security: [{ BearerAuth: [], StepUpMFAAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      summary: "[RETIRED 2026-11-26] Sign a Cost or Destructive Operation Approval token"
      operationId: createOperationApproval
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostApprovalRequest"
      responses:
        "201": { description: Signed approval_id issued }
  /api/v1/cloud/servers:
    get:
      tags: [14_Server_Management]
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - name: connection_id
          in: query
          schema: { type: string }
      summary: "[RETIRED 2026-11-26] List managed servers for the organization"
      operationId: listServers
      deprecated: true
      responses:
        "200": { description: Unified multi-cloud server inventory }
    post:
      tags: [13_Server_Provisioning]
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      summary: "[RETIRED 2026-11-26] Provision a server with a signed approval"
      operationId: provisionServer
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201": { description: Managed server created as PROVISIONING with provider_sync pending note }
        "400": { description: Blocked by budget policy, invalid approval, or safety gate }
        "403": { description: Missing cost approval or read-only token }

  # 14. Server Management API — RETIRED 2026-11-26 (BYOC removed)
  /api/v1/cloud/servers/inventory:
    get:
      tags: [14_Server_Management]
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgIdHeader" }]
      summary: "[RETIRED 2026-11-26] Server inventory (was PLANNED; BYOC removed)"
      operationId: listServersInventory
      deprecated: true
      responses:
        "200": { description: Unified multi-cloud server inventory }
  /api/v1/cloud/servers/{server_id}:
    get:
      tags: [14_Server_Management]
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgIdHeader" }
        - name: server_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      summary: "[RETIRED 2026-11-26] Get server status and operation history"
      operationId: getServerDetail
      deprecated: true
      responses:
        "200": { description: Server detail }
    delete:
      tags: [14_Server_Management]
