# Production override. Usage (from repo root, with a real .env):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Missing secrets fail fast with the message below instead of booting insecure.
services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required for production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required for production}

  api:
    environment:
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required for production (tirpscanr.com family)}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET (32+ bytes) is required for production}
      AFFILIATE_SIGNING_SECRET: ${AFFILIATE_SIGNING_SECRET:?AFFILIATE_SIGNING_SECRET (32+ bytes) is required for production}
      KMS_KEY_ID: ${KMS_KEY_ID:?KMS_KEY_ID is required for production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required for production}
      ENABLE_RETIRED_CLOUD_ROUTES: ${ENABLE_RETIRED_CLOUD_ROUTES:-false}

  worker:
    environment:
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required for production (tirpscanr.com family)}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
