version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudscanr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudscanr
      POSTGRES_PASSWORD: cloudscanr_dev_password_only
      POSTGRES_DB: cloudscanr_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./03_DATABASE/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudscanr -d cloudscanr_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: cloudscanr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: cloudscanr-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: cloudscanr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DOMAIN: cloudscanr.com
      HTTP_PORT: 8080
      DATABASE_URL: postgres://cloudscanr:cloudscanr_dev_password_only@postgres:5432/cloudscanr_prod?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      KMS_KEY_ID: local-dev-mock-key-001
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
  osdata:

